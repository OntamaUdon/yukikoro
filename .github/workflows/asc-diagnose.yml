name: App Store Connect の診断（読むだけ）

# 配ったビルドに入っている権限（entitlements）と、TestFlight のクラッシュの原因部分を表示する。
# 何も書き込まない。ログは公開されるので、メール・端末の識別子・コメントは出さない。
# v2-tower への push（このファイルを変えたとき）か、手動で動く。

on:
  workflow_dispatch:
  push:
    branches: [v2-tower]
    paths: [".github/workflows/asc-diagnose.yml"]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: 準備
        run: pip install --quiet pyjwt cryptography requests

      - name: 診断
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          APP_ID: "6834731637"
        run: |
          cat > "$RUNNER_TEMP/diagnose.py" <<'PY'
          import os, re, time, jwt, requests

          body = re.sub(r"-----(BEGIN|END) PRIVATE KEY-----|\s", "", os.environ["P8"].replace("\r", ""))
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i+64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n"
          token = jwt.encode(
              {"iss": os.environ["ISSUER_ID"], "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              pem, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          H = {"Authorization": "Bearer " + token}
          B = "https://api.appstoreconnect.apple.com"
          app = os.environ["APP_ID"]

          def get(path, **params):
              r = requests.get(B + path, headers=H, params=params, timeout=60)
              if r.status_code != 200:
                  print("  !! %s -> %s %s" % (path, r.status_code, r.text[:300]))
                  return None
              return r.json()

          print("=== 最近のビルド（権限） ===")
          builds = get("/v1/builds", **{"filter[app]": app, "sort": "-uploadedDate", "limit": 3,
                                        "include": "buildBundles", "fields[buildBundles]": "bundleId,bundleType,entitlements"})
          inc = {(i["type"], i["id"]): i for i in (builds or {}).get("included", [])}
          for b in (builds or {}).get("data", []):
              a = b["attributes"]
              print("ビルド", a.get("version"), "| 処理:", a.get("processingState"), "| 期限切れ:", a.get("expired"))
              for ref in b.get("relationships", {}).get("buildBundles", {}).get("data", []) or []:
                  ba = inc.get((ref["type"], ref["id"]), {}).get("attributes", {})
                  print("  bundleId:", ba.get("bundleId"), "| type:", ba.get("bundleType"))
                  print("  entitlements:", ba.get("entitlements"))

          print()
          print("=== クラッシュ（TestFlight のフィードバック） ===")
          subs = get("/v1/apps/%s/betaFeedbackCrashSubmissions" % app, sort="-createdDate", limit=3)
          data = (subs or {}).get("data", [])
          if not data:
              print("まだ届いていません（数分〜1時間かかることがあります）")
          for s in data:
              a = s["attributes"]
              print("--- 日時:", a.get("createdDate"), "| OS:", a.get("osVersion"), "| 機種:", a.get("deviceModel"))
              log = get("/v1/betaFeedbackCrashSubmissions/%s/crashLog" % s["id"])
              text = ((log or {}).get("data", {}).get("attributes", {}) or {}).get("logText") or ""
              lines = text.splitlines()
              keep = []
              for i, line in enumerate(lines):
                  if re.match(r"(Exception Type|Exception Codes|Termination Reason|Termination Description|Triggered by Thread|Application Specific Information)", line):
                      keep.append(line)
                  if line.startswith("Last Exception Backtrace") or re.match(r"Thread \d+ Crashed", line):
                      keep.append(line)
                      keep.extend(lines[i+1:i+26])
                  if re.match(r"\s*\"?(exception|termination|asi|reason)", line.lower()) and len(line) < 400:
                      keep.append(line)
              print("\n".join(keep) if keep else "(ログの本文が取れませんでした)")
          PY
          python3 "$RUNNER_TEMP/diagnose.py"
