name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Build (iOS Simulator, app + widget)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Yukikoro.xcodeproj \
            -scheme Yukikoro \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | tail -n 60

      - name: Unit tests
        run: |
          set -o pipefail
          NAME=$(xcrun simctl list devices available | grep -m1 -E '^\s+iPhone' | sed -E 's/^ +//; s/ \([0-9A-F-]{36}\).*//')
          echo "Using simulator: $NAME"
          xcodebuild test \
            -project Yukikoro.xcodeproj \
            -scheme Yukikoro \
            -destination "platform=iOS Simulator,name=$NAME" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | tail -n 80

      - name: Screenshots (simulator)
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name Yukikoro.app | head -1)
          echo "App: $APP"
          tools/screenshots.sh "$APP" shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            test.log
