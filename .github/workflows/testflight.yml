name: TestFlight にアップロード（手動）

# Mac が無くても TestFlight に出すためのワークフロー。手動で実行したときだけ動く。
# 事前準備は docs/TESTFLIGHT.md の「Mac が無い場合」を参照。
# ※ 認証情報が無いと作者は実行できないため、このワークフローは未検証。失敗したらログを見て調整が必要。

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 必要な設定が入っているか確認
        run: |
          for v in TEAM_ID KEY_ID ISSUER_ID; do
            if [ -z "${!v}" ]; then echo "::error::GitHub の Secrets に $v（ASC_...）が入っていません"; exit 1; fi
          done
          if [ -z "${{ secrets.ASC_KEY_P8 }}" ]; then echo "::error::Secrets に ASC_KEY_P8 が入っていません"; exit 1; fi
          if grep -q "com.example" project.yml; then echo "::error::Bundle ID が仮のままです。tools/set_bundle_id.py で変えてください"; exit 1; fi

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect API キーを保存（貼り付けで改行が崩れていても直す）
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          body=$(printf '%s' "$P8" | tr -d '\r' | sed -e 's/\n//g' -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \n\t')
          if [ -z "$body" ]; then echo "::error::ASC_KEY_P8 の中身が空か、.p8 の形式ではありません"; exit 1; fi
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$body" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          # 形式の確認（中身は表示しない）
          openssl pkey -in "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" -noout && echo "鍵の形式は正しいです" || { echo "::error::ASC_KEY_P8 が正しい .p8 の中身ではありません。.p8 ファイルをテキストエディタで開き、全文を Secrets に貼り直してください"; exit 1; }

      - name: アーカイブ（署名は Xcode の自動署名に任せる）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Yukikoro.xcodeproj \
            -scheme Yukikoro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Yukikoro.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 40

      - name: App Store Connect へアップロード
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Yukikoro.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: キーを削除
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
