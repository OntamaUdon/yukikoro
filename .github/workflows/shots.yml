name: 画面の撮影（手動）

# シミュレーターでアプリを起動して、画面を撮る（テストはしない）。Actions → この名前 → Run workflow
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Yukikoro.xcodeproj \
            -scheme Yukikoro \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | tail -n 30

      - name: Screenshots (simulator)
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name Yukikoro.app | head -1)
          echo "App: $APP"
          bash tools/screenshots.sh "$APP" shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
